services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_wechat
      POSTGRES_USER: ai_wechat
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - device-postgres:/var/lib/postgresql/data
    networks:
      - registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_wechat -d ai_wechat"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    pids_limit: 200
    mem_limit: 512m
    cpus: 1.0

  prepare-secrets:
    image: alpine:3.23
    restart: "no"
    read_only: true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /run/secrets/device_database_dsn /prepared/device_database_dsn
        cp /run/secrets/device_pepper /prepared/device_pepper
        chown 65532:65532 /prepared/device_database_dsn /prepared/device_pepper
        chmod 0400 /prepared/device_database_dsn /prepared/device_pepper
    secrets:
      - source: device_database_dsn
        target: device_database_dsn
      - source: device_pepper
        target: device_pepper
    volumes:
      - registry-secrets:/prepared
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=4m
    networks:
      - registry
    security_opt:
      - no-new-privileges:true
    pids_limit: 20
    mem_limit: 32m
    cpus: 0.25

  migrate:
    image: ai-wechat-tools:local
    build:
      context: ..
      dockerfile: Dockerfile.tools
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command:
      - migrate
      - --database-dsn-file
      - /run/secrets/device_database_dsn
      - --pepper-file
      - /run/secrets/device_pepper
    depends_on:
      postgres:
        condition: service_healthy
      prepare-secrets:
        condition: service_completed_successfully
    volumes:
      - registry-secrets:/run/secrets:ro
    networks:
      - registry
    pids_limit: 50
    mem_limit: 128m
    cpus: 0.5

  gateway:
    image: ai-wechat-gateway:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 1.0
    environment:
      GATEWAY_TCP_ADDRESS: ":19090"
      GATEWAY_HEALTH_ADDRESS: ":18080"
      GATEWAY_MAX_BODY_BYTES: "1048576"
      GATEWAY_MAX_UNAUTHENTICATED_CONNECTIONS: "50"
      GATEWAY_MAX_UNAUTHENTICATED_PER_IP: "5"
      GATEWAY_MAX_AUTHENTICATED_CONNECTIONS: "150"
      GATEWAY_AUTH_MODE: device-registry
      GATEWAY_DEVICE_DATABASE_DSN_FILE: /run/secrets/device_database_dsn
      GATEWAY_DEVICE_PEPPER_FILE: /run/secrets/device_pepper
    ports:
      - "127.0.0.1:${GATEWAY_TCP_HOST_PORT:-19090}:19090"
      - "127.0.0.1:${GATEWAY_HEALTH_HOST_PORT:-18080}:18080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - registry-secrets:/run/secrets:ro
    networks:
      - edge
      - registry
    healthcheck:
      test: ["CMD", "/gateway", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

  admin-web:
    image: ai-wechat-admin:local
    build:
      context: ..
      dockerfile: Dockerfile.admin
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ADMIN_HTTP_ADDRESS: ":18181"
      ADMIN_DATABASE_DSN_FILE: /run/secrets/device_database_dsn
      ADMIN_DEVICE_PEPPER_FILE: /run/secrets/device_pepper
      ADMIN_TRUST_HTTPS_PROXY: "true"
      ADMIN_CONTAINER_BIND: "true"
    ports:
      - "127.0.0.1:${ADMIN_HTTP_HOST_PORT:-18181}:18181"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - registry-secrets:/run/secrets:ro
    networks:
      - edge
      - registry
    healthcheck:
      test: ["CMD", "/admin-web", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 3s
      retries: 3
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    pids_limit: 50
    mem_limit: 256m
    cpus: 0.5

  tools:
    image: ai-wechat-tools:local
    build:
      context: ..
      dockerfile: Dockerfile.tools
    profiles:
      - tools
    restart: "no"
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - registry-secrets:/run/secrets:ro
    networks:
      - registry
    pids_limit: 50
    mem_limit: 128m
    cpus: 0.5

volumes:
  device-postgres:
  registry-secrets:

networks:
  edge:
  registry:
    internal: true

secrets:
  device_database_dsn:
    file: ${DEVICE_DATABASE_DSN_FILE:-./secrets/device-database.dsn}
  device_pepper:
    file: ${DEVICE_PEPPER_FILE:-./secrets/device-pepper}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./secrets/postgres-password}
